# es4all AUDIO OUTPUT —— Skyworth E900V22C (S905L3A / G12A) / EmuELEC
# ---------------------------------------------------------------------------
# ★机型专属独一份★: 下发后整份取代上层同名档, 不是叠加。只写自己这台。
# 机型子串比对 /proc/device-tree/model(实机字串 "Skyworth E900V22C")。
# ---------------------------------------------------------------------------

# 实机验证 2026-07-19 (aplay -l + 逐一实听):
#   HDMI = hw:0,2 (SPDIF-dummy -> HDMITX)
#   AV   = hw:0,1 (TDM-B-T9015 模拟 DAC -> 3.5mm)
#   无光纤孔。★有 ALSA PCM ≠ 有实体孔★, 别照抄别台, 一定要实听确认。
#
# ★与 MD1000 不同: 这两个是【同一张卡】的两个 device★。
# 后果一: 只改 dmix 的 slave 就够, softvol/ctl 的 card 值不变(仍是 0)。
# 后果二: 同一个 AUGE 控制器同时喂 HDMITX 与 T9015, 选了 AV 之后 HDMI 仍在出声,
#         必须额外把 'Audio hdmi-out mute' 设为 on 才能让 AV 独占。
#         这一步由 E/_common/bin/setaudio.sh 依标签处理。
E900V22C   HDMI:0,2 AV:0,1
