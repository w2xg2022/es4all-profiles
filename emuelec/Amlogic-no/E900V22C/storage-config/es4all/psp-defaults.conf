# es4all: E900V22C (Amlogic S905L3A, Mali-G31) 的 PSP 预设 ——
# 覆盖 common/bin/apply.sh 里的全机种预设值(OPENGL / 2X)。
#
# ★后端维持 OPENGL★: G31 是 Bifrost 第一代, EmuELEC 在 Amlogic 上没有可靠的
#   Vulkan 驱动 —— 开了不是变慢就是黑屏。Vulkan 留给 G52 以上(见 E/RK3566/MD1000)。
#
# ★分辨率拉到 4X★: 实测这台的 G31 跑得动独立版 PPSSPP 的 4X。
#   这推翻了「弱 GPU 只能 2X」的直觉 —— PSP 的瓶颈常在 CPU(尤其 ATRAC3+ 解码),
#   填充率反而不是第一个撞到的墙。
#
# ⚠️ 这是【资料】不是机制: 只有这两个键会被读, apply.sh 不会 source 本档。
# ⚠️ 这是「预设」不是「强制」: 使用者之后自己在 PPSSPP 里改过画质不会被改回来
#    (只有本档的建议值本身变了才会重新套用一次)。
BACKEND=OPENGL
RESOLUTION=4
