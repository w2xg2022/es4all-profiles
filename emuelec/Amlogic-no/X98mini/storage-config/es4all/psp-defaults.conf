# es4all: X98mini (Amlogic S905W2, Mali-G31) 的 PSP 预设 ——
# 值与 common/bin/apply.sh 的全机种预设(OPENGL / 2X)相同。
#
# ★既然跟预设一样, 为什么还要这个档★
#   为了把「这台【测过】, 结论就是 2X」跟「这台【没人测过】, 只是吃到保底值」
#   两件事分开。没有档案时两者长得一模一样, 日后没人知道该不该往上调。
#   档案在, 就代表这个数字是决定过的。
#
# 同为 G31 但比 E900V22C 保守一级: 后端维持 OPENGL(Amlogic 上没有可靠的 Vulkan 驱动)。
#
# ⚠️ 这是【资料】不是机制: 只有这两个键会被读, apply.sh 不会 source 本档。
# ⚠️ 这是「预设」不是「强制」: 使用者自己改过的画质不会被改回来。
BACKEND=OPENGL
RESOLUTION=2
