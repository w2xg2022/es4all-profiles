# es4all: X98mini (Amlogic S905W2/S4, 32GB eMMC) 写入 eMMC 的机型资料。
#
# ★这个档【存在与否】就是「退出选单要不要出现『写入 eMMC』」的依据★
#   (ES: Es4allProfiles::hasFile("storage-config/es4all/emmc-layout.conf"))。
#   判断依据刻意是【资料】不是【机制】—— 机制 installtoemmc.sh / -engine.sh 放在
#   _common, 每台 EmuELEC 都会下载到; 有配方才代表这台真的验证过。
#   没有这个档, 选单就不出现 —— 这正是先前 X98mini 「写入 eMMC 做不到」的原因:
#   引擎里的 board 表本来就有这台, 缺的只是这一行配方。
#
# BOARD 是 bin/installtoemmc-engine.sh 里 board 表的键。
# 该 case 的方式是 reuse —— 锁机 Amlogic 盒: 原厂 u-boot 不能重新分区, 只能重用两个既有分区。
BOARD=x98mini
