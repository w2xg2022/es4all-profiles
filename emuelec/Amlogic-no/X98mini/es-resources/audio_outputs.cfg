# es4all AUDIO OUTPUT —— X98mini (S905W2 / S4) / EmuELEC
# ---------------------------------------------------------------------------
# ★机型专属独一份★: 下发后整份取代上层同名档, 不是叠加。只写自己这台。
# 机型子串比对 /proc/device-tree/model。
# ---------------------------------------------------------------------------

# 实机验证 2026-07-25 (aplay -l + 每个装置 speaker-test 440Hz 正弦, 实听确认):
#   HDMI = hw:0,2 (SPDIF-SPDIF -> HDMITX)
#   AV   = hw:0,3 (TDM-C-T9015 模拟 DAC -> 3.5mm)
#
# ★HDMI 与 AV 由【不同来源】喂★(mixer 的 'HDMITX Audio Source Select' 读到 Spdif,
# AV 走 TDM-C)。实听验证: 播到 hw:0,3 时 HDMI 完全静音 —— 故本机型
# **不需要** 'Audio hdmi-out mute' 步骤(E900V22C 才需要, 那台两个输出共用 TDM/AUGE)。
# setaudio.sh 会自己判断该控制项存不存在, 不必在此另做设定。
#
# ⚠️ 需要 dai-link@3 的 codec 是 T9015 的那份 dtb。若 aplay -l 显示 'TDM-C-dummy'
#    而不是 'TDM-C-T9015', 表示开机的 dtb 缺该修正 —— 内核层的事, profile 救不了。
X98mini    HDMI:0,2 AV:0,3
