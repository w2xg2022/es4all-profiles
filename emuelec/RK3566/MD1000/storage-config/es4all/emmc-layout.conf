# es4all: MD1000 (RK3566) 写入 eMMC 的机型资料。
#
# ★这个档【存在与否】就是「退出选单要不要出现『写入 eMMC』」的依据★
#   (ES: Es4allProfiles::hasFile("storage-config/es4all/emmc-layout.conf"))。
#   判断依据刻意是【资料】不是【机制】—— 机制 installtoemmc.sh 放在 _common,
#   每台 EmuELEC 都会下载到; 有配方才代表这台真的验证过。
#   没验证过就跑 = 拿别台的分区方案砍这台的 eMMC。
#
# BOARD 是发行版安装器(/usr/bin/installtoemmc.sh)board 表里的键。
# 该表里 md1000 的 case 是 METHOD="repartition", 装出来的是
# 【与 U 盘映像完全相同的三分区】:
#   p1 EMUELEC(FAT32, 2GiB)  p2 STORAGE(ext4, 6GiB)  p3 EEROMS(ext4, 其余)
#
# ★为什么必须是这个顺序★: eemount 找 EEROMS 【不是先看标签】, 而是把 /flash
#   的装置名最后一个字元换成 '3'(src/eemount.c 的字串加工), 标签只是最后的退路。
#   /flash 在 p1 时它算出 p3 = EEROMS, 天生正确; 前面多塞一个分区就会把
#   STORAGE 挂到 /storage/roms 上, 症状是【ES 一个游戏都看不到】。
#   加第四个 EEROMS 分区也救不了 —— 位置那一步会先成功, 根本走不到标签。
#
# ⚠️★装完就【不再具备 U 盘开机能力】★: 旧方案保留 p1 Armbian /boot 当链载宿主,
#   新方案整颗从 p1 起全抹掉。这台的 u-boot 读不到 U 盘, 一直以来都是靠 eMMC 上
#   Armbian 的 /boot 把内核载起来的; 那个没了之后, 插回 U 盘也开不了机。
#   救援只剩 MASKROM 重刷(bootloader 保留区全程没动, 所以这条路一定还在)。
#
# ⚠️ 装完要【关机、拔掉 U 盘、再通电】—— u-boot 每次开机都先试 SD/USB 再试 eMMC,
#    软重开不会帮你拔 U 盘。
BOARD=md1000
