# es4all AUDIO OUTPUT —— MD1000 (RK3566) / EmuELEC
# ---------------------------------------------------------------------------
# ★这是【机型专属的独一份】★: 下发后整份取代上层的同名档, 不是叠加。
# 所以本档只需要写自己这台, 不必(也不该)带别的机型。
#
# 格式:  <机型子串>   <标签:card,device> ...
#   机型子串比对 /proc/device-tree/model。实机确认字串为 "MD1000 RK3566",
#   ★键必须用 MD1000, 不能用 RK3566★ —— P6 机顶盒同样是 RK3566 但 codec 是
#   ES8323 不是 RK809, 用 RK3566 当键会被子串误命中, 把音频路到结构完全不同的卡上。
#   (注意区分: /ee_arch 与 EE_DEVICE 在本机确实是 RK3566, 那是韧体脚本用的识别码,
#    与这里比对的 device-tree model 是两回事。)
# ---------------------------------------------------------------------------

# ★两张【独立的卡】★(实机 aplay -l 确认):
#     card 0: HDMI  [HDMI]        fe400000.i2s -> HDMI
#     card 1: RK809 [Analog RK809] fe410000.i2s -> RK809 模拟输出(3.5mm AV)
#
# ★一律按卡名定址, 绝不写卡号★: 两张 simple-card 的探测顺序不固定, 0/1 会在两次
# 开机之间对调(同一台实测过两种顺序)。写死 hw:0,0 必然周期性把声音送错孔。
#
# 因为是两张独立的卡, 切换本身就是真切换 —— 选了 AV, HDMI 自然静音,
# 不需要 E900V22C 那种额外的 'Audio hdmi-out mute' 步骤。
#
# ⚠️ 但也因为是两张卡, 只改 dmix 的 slave 不够: softvol 的 control.card 与
#    ctl.!default 的 card 必须一起跟着换, 否则「声音去了 AV、音量却还挂在 HDMI 卡上」。
#    这件事由 E/_common/bin/setaudio.sh 处理(内建的 emuelec-utils setauddev 做不到)。
#
# ⚠️ AV 还需要设备树里有 RK809 + i2s1 TX-only pinctrl。若 aplay -l 只看得到 HDMI,
#    表示开机的 dtb 缺那份修正 —— 那是内核层的事, profile 救不了。
MD1000     HDMI:CARD=HDMI,DEV=0 AV:CARD=RK809,DEV=0
