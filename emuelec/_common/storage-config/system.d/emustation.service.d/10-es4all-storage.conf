# es4all: 内外部盘聚合 —— 挂在 emustation.service 的 ExecStartPre 上。
#
# ★为什么用 drop-in 而不是独立的 oneshot 服务★
#   独立服务是 Type=oneshot + RemainAfterExit=yes, 一次开机只跑一次。
#   但选单里切换「外接装置」之後需要**重新套用挂载**, 而重新挂载又要求
#   /storage/roms 没有程序占用 —— 也就是必须先把 ES 停掉。
#   挂在 ExecStartPre 上, 这两件事就合并成同一个动作:
#       重启 ES = ES 先停(roms 空出来) -> 聚合脚本重跑 -> ES 再起
#   於是选单只要 `systemctl restart emustation`, 不必再有一个「立即挂载」按钮,
#   也不会出现「设定改了但没生效」这种状态。
#
# ★前面那个 `-` 不能拿掉★: 它让 systemd 忽略这支的失败。
#   聚合只是加值功能, 而 ES 起不来是灾难等级 —— 绝不能因为挂载脚本出错就开不了机。
#   (脚本本身也一律 exit 0, 这里是第二道保险。)
#
# 放在 /storage/.config/system.d 底下的 <unit>.d/ 目录, systemd 会与韧体里的
# emustation.service 合并 —— 不必动只读的 /usr, 整包由 es4all-profiles 下发。
[Service]
ExecStartPre=-/storage/.config/es4all/bin/es4all-storage.sh
