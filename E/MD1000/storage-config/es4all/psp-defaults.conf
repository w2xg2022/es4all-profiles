# es4all: MD1000 (RK3566) 的 PSP 预设 —— 覆盖 E/_common/bin/apply.sh 里的全机种预设值。
#
# 全机种预设是 OPENGL / 2X(安全值, 旧 Mali 也跑得动)。
# 本机 SoC 是 RK3566, GPU 为 Mali-G52 —— Vulkan 驱动可用且效能优于 OpenGL,
# 故覆盖为 VULKAN / 4X。
#
# ⚠️ 这是【资料】不是机制: 只有这两个键会被读, apply.sh 不会 source 本档
#    (资料档不该有执行能力)。要改流程请改 E/_common/bin/apply.sh。
#
# ⚠️ 只在【第一次】套用(apply.sh 用标记档把关) —— 使用者之后自己在 PPSSPP 里
#    改过画质, 不会被下次开机改回来。这是「预设」不是「强制」。
BACKEND=VULKAN
RESOLUTION=4
