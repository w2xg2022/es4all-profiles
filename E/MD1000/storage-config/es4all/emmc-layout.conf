# es4all: MD1000 (RK3566) 写入 eMMC 的机型资料。
#
# ★这个档【存在与否】就是「退出选单要不要出现『写入 eMMC』」的依据★
#   (ES: Es4allProfiles::hasFile("storage-config/es4all/emmc-layout.conf"))。
#   判断依据刻意是【资料】不是【机制】—— 机制 installtoemmc.sh 放在 _common,
#   每台 EmuELEC 都会下载到; 有配方才代表这台真的验证过。
#   没验证过就跑 = 拿别台的分区方案砍这台的 eMMC。
#
# BOARD 是发行版安装器(/usr/bin/installtoemmc.sh)board 表里的键。
# 该表里 md1000 的 case 是 METHOD="repartition":
#   保留 u-boot 保留区(DRAM 时序已校准)与 p1 BOOT(链载宿主),
#   p2 起的 Armbian rootfs 换成 p2 EMUELEC(FAT32) + p3 STORAGE(ext4)。
#   救援: 分区表与 bootloader 保留区全程没动, 一律可用 MASKROM 重刷 Armbian。
#
# ⚠️ 装完要【关机、拔掉 U 盘、再通电】才会从 eMMC 开机 ——
#    u-boot 每次开机都先试 SD/USB 再试 eMMC, 软重开不会帮你拔 U 盘。
BOARD=md1000
