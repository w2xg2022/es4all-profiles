# es4all: 内外盘聚合 —— 挂在 ROCKNIX 的 ES 服务的 ExecStartPre 上。
#
# ★ROCKNIX 的 ES 服务叫 essway.service, 不是 emustation.service★
#   它是「EmulationStation with Sway」, ExecStart=/usr/bin/start_es.sh。
#   emustation.service 在这个发行版里也存在, 但是 inactive —— 把 drop-in 放到
#   那个名字底下会【完全不生效, 而且不报错】, 表现是「聚合设了却没挂上」。
#
# ★为什么用 drop-in 而不是独立的 oneshot 服务★
#   重新套用挂载要求 /storage/roms 没有程序占用 = 必须先把 ES 停掉。挂在
#   ExecStartPre 上, 这两件事就合并成同一个动作: 重启 ES = 重新套用挂载。
#
# ★前面那个 `-` 不能拿掉★: 它让 systemd 忽略这支的失败。
#   聚合只是加值功能, 而 ES 起不来是灾难等级 —— 绝不能因为挂载脚本出错就开不了机。
#   (脚本本身也一律 exit 0, 这里是第二道保险。)
#
# mergerfs 本体不会跑在这个 cgroup 里: 脚本用 systemd-run 把它放进独立的
# transient unit(es4all-mergerfs.service)。不这样做的话, ES 每退出一次
# systemd 就把 mergerfs 一起收掉, 挂载点变成 "Transport endpoint is not connected",
# ES 一个系统都找不到 -> 退出 -> 重启 -> 更坏。实机踩过(ARMBIAN 侧, 2026-08-04)。
[Service]
ExecStartPre=-/storage/.config/es4all/bin/es4all-storage.sh
