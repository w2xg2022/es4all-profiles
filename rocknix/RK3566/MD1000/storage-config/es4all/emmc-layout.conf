# es4all: MD1000 (RK3566) 写入 eMMC 的机型资料。ROCKNIX 版。
#
# ★这个档【存在与否】就是「退出选单要不要出现『写入 eMMC』」的依据★
#   (ES: Es4allProfiles::hasFile("storage-config/es4all/emmc-layout.conf"))。
#   判断依据刻意是【资料】不是【机制】—— 机制 installtoemmc.sh 放在 _common,
#   每台 ROCKNIX 都会下载到; 有配方才代表这台真的验证过。
#   没验证过就跑 = 拿别台的分区方案砍这台的 eMMC。
#
# BOARD 是 bin/installtoemmc.sh 内建 board 表里的键(该表的 case 就叫 md1000)。
# 脚本没拿到参数时会来读这一行, 所以这不是一个没人看的旗标。
#
# ⚠️★ROCKNIX 与 EmuELEC 的安装器【不是同一支】★
#   两边同名不同实作: EmuELEC 那支是 conf 驱动的统一引擎(installtoemmc-engine.sh),
#   ROCKNIX 这支是自带 board 表的独立脚本。目前刻意不合并 ——
#   合并的收益是少维护一份, 代价是拿【没验过的分区逻辑】去砍 eMMC,
#   而这类错误的表现就是开不了机。等两边都各自验过再谈统一。
#
# ⚠️ 另外别与上游的 installtointernal 搞混: 那是 ROCKNIX 自带的, MD1000 用了开不了机。
BOARD=md1000
