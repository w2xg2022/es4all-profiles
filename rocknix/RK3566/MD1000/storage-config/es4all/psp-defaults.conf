# es4all: MD1000 (RK3566) 在 ROCKNIX 上的 PSP 预设 ——
# 覆盖 common/bin/apply.sh 里的全机种预设值(OPENGL / 2X)。
#
# 与 emuelec/RK3566/MD1000 那份【同值】, 因为是同一颗 SoC 的同一颗 GPU(Mali-G52):
# Vulkan 驱动可用且效能优于 OpenGL。
#
# ★为什么要各发行版各存一份, 不共用★
#   合理的建议值取决於【GPU + 该发行版的驱动栈】两件事, 不是只看硬体 ——
#   同一颗 G52 在不同发行版上, Vulkan 驱动的成熟度可以差很多。
#   共用一份会让「其中一边实测发现要调低」变成没地方写。
#
# ★用哪一支模拟器不写在这里★: 独立版 vs libretro 是发行版层级的事实,
#   写在 common/bin/apply.sh 的 target 表里(ROCKNIX 是 psp.emulator=ppsspp /
#   psp.core=ppsspp-sa —— 两个键不同值, 别照 EmuELEC 抄)。
#
# ⚠️ 这是【资料】不是机制: 只有下面两个键会被读, apply.sh 不会 source 本档。
# ⚠️ 这是「预设」不是「强制」: 使用者自己在 PPSSPP 里改过的画质不会被改回来。
BACKEND=VULKAN
RESOLUTION=4
