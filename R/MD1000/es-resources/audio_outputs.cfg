# es4all AUDIO OUTPUT —— MD1000 (RK3566) / ROCKNIX
# ---------------------------------------------------------------------------
# ★机型专属独一份★: 下发后整份取代上层同名档, 不是叠加。只写自己这台。
#
# 内容与 E/MD1000 那份相同(同一块板子、同样两张卡), 但**刻意各留一份**:
# 两边的后端完全不同 —— EmuELEC 是裸 ALSA(改 asound.conf), ROCKNIX 走 PipeWire
# (改默认 sink)。将来任一边要调整时, 不该被迫牵动另一边。
# ---------------------------------------------------------------------------

# 两张独立的卡, 一律按卡名定址(探测顺序不固定, 卡号会在两次开机之间对调):
#   HDMI  = fe400000.i2s -> HDMI
#   AV    = fe410000.i2s -> RK809 "Analog RK809"
#
# ROCKNIX 侧由 glue 脚本 es4all-setauddev 消费: 它只取其中的 card, 在执行期解析成
# PipeWire sink id(wpctl 的数字 id 每次开机都会变, 不能持久化)。
# 实机验证 2026-07-23: card0 -> sink 69, card1 -> sink 55, 双向切换正常。
#
# ⚠️ 需要设备树里有 RK809 + i2s1 TX-only pinctrl。aplay -l 只见 HDMI/SPDIF 就是
#    开机的 dtb 缺那份修正 —— 内核层的事, profile 救不了。
MD1000     HDMI:CARD=HDMI,DEV=0 AV:CARD=RK809,DEV=0
